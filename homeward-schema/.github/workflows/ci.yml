name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f7fa1602a4b42e9959 # 1.85.0
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b59f239b1462b4d # v2.7.8
        with:
          workspaces: ". -> target"

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@34899fc7ba81ca6268e55b94b31e4fa8a3ba66ca # v2.0.11
        with:
          command: check bans licenses sources

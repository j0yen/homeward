[package]
name = "homeward-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Read-only MCP server exposing the homeward shelter database: search_pets, get_pet, and a recent_intakes resource, over stdio and streamable HTTP."
publish = false

[lints]
workspace = true

[[bin]]
name = "homeward-mcp"
path = "src/main.rs"

[dependencies]
homeward-schema = { path = "../homeward-schema" }
# Not used for its query filtering (see src/filter.rs's doc comment for why:
# query_shelter doesn't support radius/breed/color and its output DTO drops
# colors/lat-lon) -- kept as a dependency solely to reuse its ApiConfig
# default result cap instead of re-declaring the "50" constant.
homeward-report = { path = "../homeward-report" }
# match_photo's embed+kNN call -- see crates/homeward-embed-client's own
# doc comment for the /enroll, /query, /health sidecar contract.
homeward-embed-client = { path = "../crates/homeward-embed-client" }
rmcp = { version = "3.2.0", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
schemars = { version = "1", features = ["chrono04"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { workspace = true }
# match_photo's image_b64 decode + magic-byte/size validation (AC5), same
# version already used by homeward-report.
base64 = "0.22"

[dev-dependencies]
ulid = { version = "1", features = ["serde"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }

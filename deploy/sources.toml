# ─── OpenDataSoft example (connector ships in homeward-ods-connector PRD) ────
#
# Uncomment and fill in to add an OpenDataSoft portal.
# [[opendatasoft]]
# name       = "example-ods"
# base_url   = "https://data.example.org"          # ODS portal root (no trailing slash)
# dataset_id = "animal-shelter-intakes"             # dataset identifier
# [opendatasoft.column_map]
# animal_id   = "animal_id"
# animal_type = "species"
# intake_type = "intake_condition"
# # Optional fields:
# # intake_date    = "intake_date"
# # breed          = "breed"
# # name           = "animal_name"

# ─── ArcGIS example (connector ships in homeward-arcgis-connector PRD) ───────
#
# Uncomment and fill in to add an ArcGIS Feature Service layer.
# [[arcgis]]
# name        = "example-arcgis"
# service_url = "https://services.arcgis.com/XXXX/arcgis/rest/services/Intakes/FeatureServer/0"
# [arcgis.column_map]
# animal_id   = "AnimalID"
# animal_type = "Species"
# intake_type = "IntakeType"
# # Optional fields:
# # intake_date    = "IntakeDate"
# # breed          = "PrimaryBreed"
# # name           = "AnimalName"

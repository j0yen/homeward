# Homeward source catalog — multi-family open-data feeds.
#
# Supported source families:
#
#   [[socrata]]       — Socrata / SODA portals (data.austintexas.gov, etc.)
#   [[opendatasoft]]  — OpenDataSoft portals (data.example.org, etc.)
#   [[arcgis]]        — Esri ArcGIS Hub Feature Services
#
# Each section is optional; any absent section defaults to an empty list.
# The four built-in Socrata cities (austin, dallas, sonoma, long_beach) are
# mirrored here so operators can extend or override them without touching
# compiled code.
#
# Re-validation command:
#   cargo run --bin homeward -- connectors probe <name>
#
# Format notes — column_map fields (apply to all three families):
#   REQUIRED: animal_id, animal_type, intake_type
#   OPTIONAL: outcome_date, kennel_status, found_location, chip_status,
#             intake_date, breed, name, color
#   (Omit optional fields rather than leaving them empty.)
#
# Socrata-only:
#   • app_token_env names the environment variable holding a SODA app token.
#     Leave unset if no token is needed (throttling still works, just slower).
#
# OpenDataSoft-only:
#   • base_url   — root URL of the ODS portal (no trailing slash)
#   • dataset_id — ODS dataset identifier string
#
# ArcGIS-only:
#   • service_url — full URL of the Feature Service layer (/.../FeatureServer/N)

# ─── Built-in cities ─────────────────────────────────────────────────────────

# validated: 2026-06-13  via: probe-green  metro: "Austin TX"
[[socrata]]
name        = "austin"
domain      = "data.austintexas.gov"
dataset_id  = "fdzn-9yqv"
app_token_env = "SOCRATA_APP_TOKEN"

[socrata.column_map]
animal_id   = "animal_id"
animal_type = "animal_type"
intake_type = "intake_type"
found_location = "found_location"
intake_date = "datetime"
breed       = "breed"
name        = "name"
color       = "color"


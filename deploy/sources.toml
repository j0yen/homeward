# Homeward source catalog — Socrata / SODA open-data feeds.
#
# Each [[socrata]] entry is one municipal shelter dataset.  The four built-in
# cities (austin, dallas, sonoma, long_beach) are mirrored here so operators
# can extend or override them without touching compiled code.
#
# Re-validation command:
#   cargo run --bin homeward -- connectors probe <name>
#
# Or, once homeward-source-probe ships:
#   homeward-source-probe --catalog deploy/sources.toml --all
#
# Format notes:
#   • column_map.animal_id / animal_type / intake_type are REQUIRED.
#   • All other column_map fields are optional (omit rather than leaving empty).
#   • app_token_env names the environment variable holding a SODA app token.
#     Leave unset if no token is needed (throttling still works, just slower).

# ─── Built-in cities ─────────────────────────────────────────────────────────

# validated: 2026-06-13  via: probe-green  metro: "Austin TX"
[[socrata]]
name        = "austin"
domain      = "data.austintexas.gov"
dataset_id  = "fdzn-9yqv"
app_token_env = "SOCRATA_APP_TOKEN"

[socrata.column_map]
animal_id   = "animal_id"
animal_type = "animal_type"
intake_type = "intake_type"
found_location = "found_location"
intake_date = "datetime"
breed       = "breed"
name        = "name"
color       = "color"

# validated: 2026-06-13  via: probe-green  metro: "Dallas TX"
[[socrata]]
name        = "dallas"
domain      = "www.dallasopendata.com"

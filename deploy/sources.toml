[socrata.column_map]
animal_id    = "animal_id"
animal_type  = "animal_type"
intake_type  = "intake_type"
outcome_date = "outcome_datetime"
kennel_status = "kennel_status"
found_location = "found_location"
chip_status  = "chip_status"
intake_date  = "intake_date"
breed        = "breed"
name         = "animal_name"
color        = "color"


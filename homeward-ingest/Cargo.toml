[package]
name = "homeward-ingest"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
description = "Freshness engine for homeward: orchestrates connectors, deduplicates PetRecords, and detects departures via a sqlite-backed store."
publish = false

[lints]
workspace = true

[dependencies]
homeward-schema = { path = "../homeward-schema" }
homeward-connectors = { path = "../homeward-connectors" }
homeward-embed-client = { path = "../crates/homeward-embed-client" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
ulid = { version = "1", features = ["serde"] }
async-trait = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }

[[bin]]
name = "homeward-ingestd"
path = "src/main.rs"

[project]
name = "homeward-embed"
version = "0.1.0"
description = "Photo-embedding pipeline: detect-and-crop animal, embed with DINOv2, HNSW index, similarity search service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Joe Yen", email = "jyen.tech@gmail.com" }]

dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.35.0",
    "ultralytics>=8.0.0",
    "hnswlib>=0.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
]

[project.scripts]
homeward-embed-svc = "homeward_embed.service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homeward_embed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

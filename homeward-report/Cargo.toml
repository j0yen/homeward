[package]
name = "homeward-report"
version = "0.4.0"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
description = "Owner-side lost-pet reports, continuous matching, match alerts, and the open read API."
publish = false

[lints]
workspace = true

[dependencies]
homeward-schema = { path = "../homeward-schema" }
homeward-embed-client = { path = "../crates/homeward-embed-client" }
homeward-match = { path = "../homeward-match" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
homeward-connectors = { path = "../homeward-connectors" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = { workspace = true }

[features]
default = []
petfbi-partner = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "homeward-reportd"
path = "src/bin/reportd.rs"

[package]
name = "homeward-connectors"
version = "0.2.3"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
description = "Source connectors for the homeward shelter-pet aggregator: RescueGroups + Socrata."
publish = false

[lints]
workspace = true

[dependencies]
homeward-schema = { path = "../homeward-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
    "deflate",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
async-trait = "0.1"
ulid = { version = "1", features = ["serde"] }
url = { workspace = true }
robots_txt = "0.7"
bytes = "1"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.5"
http-types = "2"
serde_json = "1"
tempfile = "3"

[[bin]]
name = "homeward"
path = "src/main.rs"

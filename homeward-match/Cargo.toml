[package]
name = "homeward-match"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
description = "Fusion matching engine for homeward: structured prefilter + score fusion + stray-hold flagging."
publish = false

[lints]
workspace = true

[dependencies]
homeward-schema = { path = "../homeward-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
ulid = { version = "1", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "homeward-match"
path = "src/main.rs"
